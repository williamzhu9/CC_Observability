version: 2

models:
  - name: fct_ws__cc_statements
    description: >
      Incremental fact table of credit card transactions, joined against the
      merchant category dimension to provide a spending category per transaction.
      Only transaction keys not already in the fact table are processed.
      Historical categories remain unchanged until a full refresh. Category is
      null for transactions whose merchant has not yet been classified.
    columns:
      - name: transaction_key
        description: Surrogate key from staging identifying each transaction occurrence.
        tests:
          - unique
          - not_null

      - name: transaction_date
        description: Date the transaction occurred.
        tests:
          - not_null

      - name: post_date
        description: Date the transaction posted to the account.

      - name: transaction_type
        description: Type of transaction (e.g. Purchase, Payment, Monthly fee).

      - name: merchant
        description: Raw merchant string from the statement. Join key to dim_ws__transaction_categories.
        tests:
          - not_null

      - name: amount_CAD
        description: Transaction amount.
        tests:
          - not_null

      - name: currency
        description: Transaction currency.

      - name: transaction_category
        description: Spending category joined in from dim_ws__transaction_categories. Null if the merchant hasn't been classified yet.
